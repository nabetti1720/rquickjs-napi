[package]
name = "rquickjs-napi"
description = "Node-API (N-API) support and native addon loading for rquickjs"
version = "0.0.6"
edition = "2021"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nabetti1720/rquickjs-napi"
exclude = ["tests/fixtures/napi/addon.node"]

[dependencies]
libloading = { version = "0.8", default-features = false }
rquickjs = { version = "0.14", features = ["futures","loader"], default-features = false }
tokio = { version = "1", features = ["sync"], default-features = false }
tracing = { version = "0.1", default-features = false }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "time"], default-features = false }
